<!doctype html>
<html lang="es" class="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1125"><title>Mi perfil — Kagura</title>
<meta name="description" content="Personaliza tu perfil de Kagura y compártelo con otros fans del anime.">
<link rel="stylesheet" href="assets/kagura.css"><link rel="stylesheet" href="assets/pages.css"><link rel="stylesheet" href="assets/rosa.css"><link rel="stylesheet" href="assets/cuentas.css">
</head><body class="dark" data-page="perfil"><div class="site-page"><main class="public-profile">
  <div class="public-cover"></div>
  <div class="public-profile__head"><span id="myAvatar" class="member-avatar">♡</span><div class="public-profile__name"><h1 id="myName">Mi perfil</h1><p id="myHandle">Tu rincón en Kagura</p></div></div>
  <div class="public-profile__body">
    <div id="profileStatus" class="account-message" role="status">Cargando cuenta…</div>
    <div id="profileContent" hidden>
      <p id="myBio"></p>
      <div class="public-profile__details"><span id="myGenre">♡ Anime</span><a id="publicLink" class="site-chip" href="comunidad.html">Ver mi perfil público ↗</a></div>
      <section style="margin-top:2.5rem"><div class="section-head"><div><h2><span class="section-head__accent"></span>Hazlo tuyo</h2><p>Estos datos serán visibles en tu perfil público. Tu correo permanece privado.</p></div></div>
        <form id="profileForm" class="profile-edit">
          <div class="field"><label for="editName">Nombre visible</label><input id="editName" maxlength="40" minlength="2" required></div>
          <div class="field"><label for="editBio">Sobre mí</label><textarea id="editBio" maxlength="240" placeholder="Cuéntanos qué anime te gusta…"></textarea><small>Hasta 240 caracteres.</small></div>
          <div class="field"><label for="editGenre">Género favorito</label><select id="editGenre"><option value="">Elige uno</option><option>Acción</option><option>Aventura</option><option>Comedia</option><option>Drama</option><option>Fantasía</option><option>Misterio</option><option>Romance</option><option>Sci-Fi</option><option>Slice of Life</option></select></div>
          <div class="field"><label>Color de avatar</label><div id="colorChoices" class="profile-edit__colors"></div></div>
          <button class="site-brand-btn" type="submit">Guardar perfil</button>
        </form>
      </section>
      <div style="margin-top:2rem;display:flex;flex-wrap:wrap;gap:.6rem"><a class="site-ghost-btn site-ghost-btn--sm" href="mi-lista.html">Mi lista</a><button id="signOut" class="site-ghost-btn site-ghost-btn--sm" type="button">Cerrar sesión</button></div>
    </div>
  </div>
</main></div>
<script src="assets/data.js"></script><script src="assets/kagura.js?v=4"></script><script src="assets/supabase-config.js?v=2"></script><script src="assets/auth.js?v=4"></script>
<script>
function pageInit() {
  var status = K.qs('#profileStatus'), content = K.qs('#profileContent');
  var colors = [['rose','Rosa'],['lilac','Lavanda'],['peach','Durazno'],['mint','Menta'],['sky','Cielo']];
  K.qs('#colorChoices').innerHTML = colors.map(function (item) { return '<label title="' + item[1] + '"><input type="radio" name="avatarColor" value="' + item[0] + '"><span class="member-avatar" data-color="' + item[0] + '">♡</span></label>'; }).join('');
  if (!KAuth.configured()) { status.innerHTML = 'No se pudo cargar la conexión de cuentas. <a href="perfil.html?v=4">Volver a intentar</a>.'; return; }
  var db, current, profile;
  function paint(p) {
    profile = p;
    K.qs('#myName').textContent = p.display_name;
    K.qs('#myHandle').textContent = '@' + p.username;
    K.qs('#myAvatar').textContent = KAuth.initials(p.display_name);
    K.qs('#myAvatar').dataset.color = KAuth.avatarColor(p.avatar_color);
    K.qs('#myBio').textContent = p.bio || 'Cuéntale a la comunidad qué historias te encantan.';
    K.qs('#myGenre').textContent = '♡ ' + (p.favorite_genre || 'Anime');
    K.qs('#publicLink').href = 'usuario.html?id=' + encodeURIComponent(p.id);
    K.qs('#editName').value = p.display_name;
    K.qs('#editBio').value = p.bio || '';
    K.qs('#editGenre').value = p.favorite_genre || '';
    var choice = K.qs('[name="avatarColor"][value="' + KAuth.avatarColor(p.avatar_color) + '"]'); if (choice) choice.checked = true;
    status.hidden = true; content.hidden = false;
  }
  KAuth.client().then(function (instance) { db = instance; return KAuth.user(); }).then(function (person) {
    if (!person) { location.replace('acceso.html?v=4'); return; }
    current = person;
    return KAuth.publicProfile(db,person.id);
  }).then(function (result) {
    if (!result) return;
    if (result.error) throw result.error;
    if (!result.data) throw new Error('Aún no se creó tu perfil. Revisa la configuración de Supabase.');
    paint(result.data);
  }).catch(function (error) { status.textContent = error.message || 'No pudimos cargar tu perfil.'; });
  K.qs('#profileForm').addEventListener('submit', function (event) {
    event.preventDefault(); if (!this.reportValidity() || !db || !current) return;
    var button = this.querySelector('[type="submit"]'); button.disabled = true;
    var changes = {display_name:K.qs('#editName').value.trim(),bio:K.qs('#editBio').value.trim(),favorite_genre:K.qs('#editGenre').value,avatar_color:K.qs('[name="avatarColor"]:checked').value};
    db.from('profiles').update(changes).eq('id',current.id).select('id,username,display_name,bio,avatar_color,favorite_genre,created_at').single().then(function (result) {
      if (result.error) throw result.error;
      paint(result.data); status.textContent = 'Perfil guardado. Ya puedes compartirlo ♡'; status.dataset.kind = 'info'; status.hidden = false;
      KAuth.updateChrome();
    }).catch(function (error) { status.textContent = error.message || 'No pudimos guardar tu perfil.'; status.dataset.kind = 'error'; status.hidden = false; }).finally(function () { button.disabled = false; });
  });
  K.qs('#signOut').onclick = function () { if (db) db.auth.signOut().then(function () { location.assign('acceso.html?v=4'); }); };
}
</script></body></html>
