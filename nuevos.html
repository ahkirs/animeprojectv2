<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novedades — Kagura</title>
<meta name="description" content="Explora anime y episodios disponibles para ver.">
<meta name="theme-color" content="#2b1125">
<link rel="stylesheet" href="assets/kagura.css">
<link rel="stylesheet" href="assets/pages.css">
<link rel="stylesheet" href="assets/rosa.css">
<link rel="stylesheet" href="assets/av1-integration.css">
</head>

<body class="dark" data-av1-page data-page="nuevos">
<div class="site-page">
  <main>
    <header class="page-head page-head--art">
      <span class="page-head__art" style="background-image:url('images/178789-9nHWmoRLlcLu.jpg')"></span>
      <div class="wrap">
        <div class="page-head__row">
          <div>
            <p class="site-label">Explora nuevos episodios</p>
            <h1>Novedades</h1>
            <p class="page-head__lead">
              Explora series y episodios disponibles para ver.
            </p>
          </div>
        </div>
      </div>
    </header>

    <div class="wrap home-stack" style="padding-top:0">

      <section>
        <div class="section-head">
          <div><h2><span class="section-head__accent"></span>Episodios</h2><p id="epSub">Vista de ejemplo</p></div>
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true"  data-lang="todos">Todos</button>
            <button class="tab" role="tab" aria-selected="false" data-lang="sub">Sub</button>
            <button class="tab" role="tab" aria-selected="false" data-lang="dub">Dub</button>
          </div>
        </div>
        <div class="ep-grid" id="epGrid"></div>
      </section>

      <section id="estrenosRow"></section>

      <section>
        <div class="section-head">
          <div><h2><span class="section-head__accent"></span>Próximamente</h2><p>Anunciadas y con fecha</p></div>
          <a class="site-chip" href="calendario.html">Ver calendario</a>
        </div>
        <div class="home-poster-grid" id="soonGrid"></div>
      </section>

      <section>
        <div class="section-head">
          <div><h2><span class="section-head__accent"></span>Añadidas al catálogo</h2><p>Series completas subidas esta semana</p></div>
        </div>
        <div id="addedList"></div>
      </section>

    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/api.js"></script>
<script src="assets/animeav1-config.js"></script>
<script src="assets/animeav1.js?v=3"></script>
<script src="assets/kagura.js?v=4"></script>
<script src="assets/supabase-config.js?v=2"></script>
<script src="assets/auth.js?v=4"></script>
<script>
function pageInit(){
  var LATEST = [
    {k:"mushoku",  ep:14,   lang:"sub"},
    {k:"onepiece", ep:1128, lang:"sub"},
    {k:"dying",    ep:13,   lang:"sub"},
    {k:"rezero",   ep:22,   lang:"dub"},
    {k:"ladies",   ep:12,   lang:"sub"},
    {k:"saint",    ep:11,   lang:"dub"},
    {k:"ninthjedi",ep:8,    lang:"sub"},
    {k:"csm",      ep:1,    lang:"dub"}
  ];

  function render(lang){
    var list = lang === "todos" ? LATEST : LATEST.filter(function(e){ return e.lang === lang; });
    K.qs("#epGrid").innerHTML = list.map(function(e){
      var a = typeof e.k === "string" ? A[e.k] : e.k;
      return '<a class="ep-card" href="' + K.href(e.k) + '">' +
        '<span class="ep-card__art">' +
          '<img src="' + K.img(a.b || a.p) + '" alt="" loading="lazy">' +
          '<span class="ep-card__num">EJEMPLO · EP ' + e.ep + '</span>' +
          '<span class="ep-card__dur">Ejemplo</span>' +
        '</span>' +
        '<span class="ep-card__body"><b>' + a.t + '</b>' +
          '<span>Tarjeta de ejemplo · ' + (e.lang === "dub" ? "Doblaje" : "Sub español") + '</span></span>' +
      '</a>';
    }).join("");
    K.qs("#epSub").textContent = list.length + " tarjetas de ejemplo · " +
      (lang === "todos" ? "todos los idiomas" : lang === "sub" ? "solo subtitulados" : "solo doblados");
  }
  render("todos");

  K.qsa("[data-lang]").forEach(function(tab){
    tab.addEventListener("click", function(){
      K.qsa("[data-lang]").forEach(function(t){ t.setAttribute("aria-selected", String(t===tab)); });
      render(tab.dataset.lang);
    });
  });

  /* estrenos */
  K.mountRow("#estrenosRow", {title:"Estrenos de la temporada",sub:"Series que empezaron este trimestre",items:["mushoku","dying","ladies","saint","ninthjedi","ribbon","kyapi","astral","rise"]});
  if (typeof API !== 'undefined') {
    API.seasonal(API.currentSeason(), API.currentYear()).then(function(res){
      K.mountRow("#estrenosRow", {title:"Estrenos de la temporada",sub:"Series que empezaron este trimestre",items:res.items});
    }).catch(function(e){});
  }

  /* próximamente */
  K.qs("#soonGrid").innerHTML = ["kyapi","astral","rise","ribbon","ninthjedi","saint","ladies"].map(function(k){
    return K.gridCard(k);
  }).join("");

  /* añadidas al catálogo */
  var ADDED = [
    {k:"fmab",      when:"lunes"},
    {k:"hxh",       when:"lunes"},
    {k:"deathnote", when:"martes"},
    {k:"gintama3",  when:"jueves"},
    {k:"aot",       when:"viernes"}
  ];
  K.qs("#addedList").innerHTML = ADDED.map(function(e,i){
    var a = A[e.k];
    return '<a class="genre-result" style="--genre-index:' + i + '" href="' + K.href(e.k) + '">' +
      '<span class="genre-result__mark"></span>' +
      '<span class="genre-result__body"><b>' + a.t + '</b>' +
        '<span>' + a.eps + ' episodios · ' + a.f + ' · ' + a.y + ' · añadida el ' + e.when + '</span></span>' +
      '<span class="ep-row__tag">Completa</span>' +
    '</a>';
  }).join("");
}
</script>
<script src="assets/av1-layout.js?v=8"></script>
</body>
</html>
